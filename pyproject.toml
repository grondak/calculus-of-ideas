[project]
name = "ideanet"
version = "0.1.0"
description = "Activation dynamics over a language-independent idea graph (calculus of ideas prototype)"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
plot = ["matplotlib"]
corpus = ["pyarrow"]
dev = ["pytest"]

[project.scripts]
ideanet = "ideanet.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ideanet"]
